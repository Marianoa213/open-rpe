name: Cloud Compile Open Remote Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libwxgtk3.2-dev \
          libasound2-dev \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswscale-dev

    - name: Run Autogen
      run: ./autogen.sh

    - name: Configure Build
      run: |
        ./configure --with-ffmpeg=system || ./configure LIBAVCODEC_CFLAGS=" " LIBAVCODEC_LIBS="-lavcodec" LIBAVFORMAT_CFLAGS=" " LIBAVFORMAT_LIBS="-lavformat" LIBAVUTIL_CFLAGS=" " LIBAVUTIL_LIBS="-lavutil" LIBSWSCALE_CFLAGS=" " LIBSWSCALE_LIBS="-lswscale"

    - name: Compile Code
      run: make

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: open-rp-compiled
        path: |
          orp
          wxorp/wxorp
